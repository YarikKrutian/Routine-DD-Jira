# Triage parameters. Change them via PR; the skill reads its values from here.

window:
  # Strictly the last 12 hours. All queries, statistics and report numbers stay inside this window.
  from: now-12h
  to: now
  hourly_points: 12

datadog:
  query: "status:error service:(celery OR uwsgi) -env:jiji-dev*"
  services: [celery, uwsgi]
  patterns:
    use_log_patterns: true
    pattern_group_by: [service]
  # Breakdown of generic patterns such as "Exception on <wildcard endpoint>"
  generic_breakdown:
    group_by: "@endpoint"
    clustering_pattern_field: "@error.message"
  stats:
    - total_error_logs
    - by_service
    - by_country        # aggregates only
    - hourly            # window.hourly_points points

classification:
  # 🚫 Infra noise — NO tickets.
  infra_noise:
    timeouts_to:
      - Elasticsearch
      - Redis/Valkey
      - Mongo
      - Telegram
      - Intercom
      - third-party APIs
    exceptions:
      - SoftTimeLimitExceeded
      - TimeLimitExceeded
    isolated:
      - OperationalError
      - deadlock
  # ✅ Already covered — a ticket found by JQL search in project = JIJI for the unique error string,
  #    task name or endpoint; also check label = auto-triage.
  # 🔴 New — no ticket. A closed ticket + the error back at real volume = regression
  #    (a new ticket + a "Relates" link to the old one).
  regression_link_type: Relates

jira:
  site: jijing.atlassian.net
  cloud_id: 4ae966c7-4f95-4aac-9ee7-24cee120152f
  project: JIJI
  issue_type: Bug
  label: auto-triage
  browse_url: "https://jijing.atlassian.net/browse/{key}"
  components:
    field: customfield_10100
    min_tags: 3
    max_tags: 5
    required: [backend, prod]       # + runtime (celery|uwsgi) + 1–2 topical tags
    existing_values_jql: "project = JIJI AND labels = auto-triage AND cf[10100] is not EMPTY ORDER BY created DESC"
  developer:
    field: customfield_10600        # "Developer №1", userpicker
    source: commit_author           # author_account_id of the source commit from scripts/code_origin.py
    min_confidence: medium          # high or medium — fill it; low — leave empty
  cause_link:
    type: Problem/Incident          # the new bug "is caused by" the source task
    min_confidence: medium          # high or medium — link; low — mention only
  translation_expand_title: "Українською"

limits:
  max_new_tickets_per_run: 15       # the remaining candidates go to the report as "over the limit"

bitbucket:
  workspace: cls-gentech
  repo_slug_env: BITBUCKET_REPO_SLUG
  email_env: BITBUCKET_EMAIL
  token_env: BITBUCKET_API_TOKEN
  clone_dir: /tmp/backend
  commit_url: "https://bitbucket.org/cls-gentech/{slug}/commits/{sha}"
  jira_key_regex: "JIJI-\\d+"

status:
  # Overall product status by the number of new 🔴 in the window.
  stable:   {emoji: "🟢", label: "Stable",   max_new: 0}
  watch:    {emoji: "🟡", label: "Watch",    max_new: 2}
  degraded: {emoji: "🔴", label: "Degraded", min_new: 3}

report:
  title_format: "Error triage {date} {ampm}"   # date and AM/PM in Kyiv time
  timezone: Europe/Kyiv
  icon: chart
  language: uk                  # the report page is in Ukrainian
  template: templates/report.html
