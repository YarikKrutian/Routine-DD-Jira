<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F3F5F8; --surface: #FFFFFF; --ink: #172033; --muted: #5A6478; --line: #DCE1E9;
    --accent: #2B59C3; --accent-soft: #E3EAF8;
    --red: #C23B2E; --red-soft: #FBE7E4; --amber: #9A6300; --amber-soft: #FBF0D9;
    --green: #1F8A5B; --green-soft: #E0F3EA; --grey-soft: #ECEFF3;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0F141C; --surface: #171E29; --ink: #E6EAF1; --muted: #9AA4B5; --line: #2A3342;
      --accent: #7EA2F2; --accent-soft: #1E2A44;
      --red: #F07167; --red-soft: #3A1F1E; --amber: #E9B949; --amber-soft: #352A12;
      --green: #5CC99A; --green-soft: #15302A; --grey-soft: #222A36;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F141C; --surface: #171E29; --ink: #E6EAF1; --muted: #9AA4B5; --line: #2A3342;
    --accent: #7EA2F2; --accent-soft: #1E2A44;
    --red: #F07167; --red-soft: #3A1F1E; --amber: #E9B949; --amber-soft: #352A12;
    --green: #5CC99A; --green-soft: #15302A; --grey-soft: #222A36;
  }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
  .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 28px; }
  h1, h2 { text-wrap: balance; margin: 0; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  h2 { font-size: 17px; font-weight: 600; }
  .eyebrow { font: 500 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 13px; }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  section { display: grid; gap: 12px; }
  .muted { color: var(--muted); }

  header { display: grid; gap: 10px; }
  .window { display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 13px; color: var(--muted); }
  .window b { color: var(--ink); font-weight: 500; }
  .example { justify-self: start; font: 500 12px var(--mono); background: var(--amber-soft); color: var(--amber); padding: 4px 8px; border-radius: 4px; }

  .status { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: start;
    background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--status-c); border-radius: 8px; padding: 18px 20px; }
  .status .badge { grid-row: span 2; font: 600 20px var(--sans); color: var(--status-c); white-space: nowrap; }
  .status .rule { font: 13px var(--mono); color: var(--muted); }
  .status p { margin: 0; max-width: 70ch; }
  @media (max-width: 560px) { .status { grid-template-columns: 1fr; } .status .badge { grid-row: auto; } }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 2px; }
  .kpi .v { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 13px; color: var(--muted); }

  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; align-content: start; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font: 11px var(--mono); }
  .bars { display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: minmax(70px, 110px) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
  .bar .track { height: 10px; background: var(--grey-soft); border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 3px; }

  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.pattern { min-width: 260px; max-width: 460px; word-break: break-word; }
  td.r { text-align: right; }
  .pill { display: inline-block; font: 500 12px var(--sans); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.new { background: var(--red-soft); color: var(--red); }
  .pill.covered { background: var(--green-soft); color: var(--green); }
  .pill.noise { background: var(--grey-soft); color: var(--muted); }
  .conf { font: 12px var(--mono); }

  ul.list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .method { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; display: grid; gap: 10px; }
  .method dl { margin: 0; display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 8px 16px; }
  .method dt { color: var(--muted); font-size: 13px; }
  .method dd { margin: 0; }
  @media (max-width: 560px) { .method dl { grid-template-columns: 1fr; } .method dd { margin-bottom: 6px; } }
  .failed { color: var(--red); }
  .empty { color: var(--muted); font-style: italic; }
</style>

<main class="wrap" id="app"></main>

<!--
  REPORT DATA. The routine replaces only the contents of this block. Schema:
  {
    "example": false,                         // true only for the template's demo data
    "run_at_kyiv": "2026-09-26 20:57",
    "window": { "from_utc": "...", "to_utc": "...", "from_kyiv": "...", "to_kyiv": "..." },
    "status": { "level": "stable|watch|degraded", "rule": "...", "conclusion": "2–3 sentences" },
    "kpi": { "total_errors": 0, "patterns": 0, "new": 0, "covered": 0, "noise": 0 },   // new/covered/noise — NUMBER OF patterns[] ROWS of that class; patterns = their sum
    "hourly": [ { "hour_kyiv": "08:57", "count": 0 } ],          // exactly 12 one-hour buckets from window.from (not calendar hours); label = bucket start, Kyiv time
    "by_service": [ { "name": "celery", "count": 0 } ],
    "by_country": [ { "name": "NG", "count": 0 } ],              // aggregates only; top 6 + "Інші (N країн)" + "невідомо"; sum = total_errors
    "patterns": [ { "pattern": "...", "service": "...", "count": 0, "class": "new|covered|noise",
                    "jira": "JIJI-123"|null, "datadog_url": "<logs_explorer_url>"|null,
                    "source_task": "JIJI-456"|null, "confidence": "high|medium|low"|null, "note": "..."|null } ],
    "created_tickets": [ { "key": "JIJI-123", "title": "...", "source_task": "JIJI-456"|null, "confidence": "..." } ],
    "over_limit": [ { "pattern": "...", "count": 0 } ],
    "methodology": { "query": "...", "window": "...", "metrics": [ { "name": "...", "definition": "..." } ],
                     "status_thresholds": "...", "source_method": "...", "confidence_levels": "..." },
    "failed_calls": [ { "call": "...", "error": "..." } ]
  }
  Numbers only from real queries. No PII or secrets. Strict JSON: no comments or trailing commas.
  Before publishing: python3 scripts/check_report.py <file> (see SKILL.md, section 6).
-->
<script id="report-data" type="application/json">
{
  "example": true,
  "run_at_kyiv": "2026-09-26 20:57",
  "window": { "from_utc": "2026-09-26 05:57", "to_utc": "2026-09-26 17:57", "from_kyiv": "2026-09-26 08:57", "to_kyiv": "2026-09-26 20:57" },
  "status": { "level": "watch", "rule": "1–2 нових 🔴 у вікні → 🟡 Watch", "conclusion": "Приклад висновку. З'явилась одна нова помилка в celery-тасці, решта патернів — відомі тікети або інфраструктурний шум. Загальний обсяг помилок у межах звичного." },
  "kpi": { "total_errors": 1240, "patterns": 3, "new": 1, "covered": 1, "noise": 1 },
  "hourly": [
    {"hour_kyiv":"09:00","count":80},{"hour_kyiv":"10:00","count":95},{"hour_kyiv":"11:00","count":110},{"hour_kyiv":"12:00","count":102},
    {"hour_kyiv":"13:00","count":98},{"hour_kyiv":"14:00","count":140},{"hour_kyiv":"15:00","count":121},{"hour_kyiv":"16:00","count":105},
    {"hour_kyiv":"17:00","count":99},{"hour_kyiv":"18:00","count":104},{"hour_kyiv":"19:00","count":92},{"hour_kyiv":"20:00","count":94}
  ],
  "by_service": [ {"name":"celery","count":820}, {"name":"uwsgi","count":420} ],
  "by_country": [ {"name":"NG","count":700}, {"name":"KE","count":260}, {"name":"GH","count":180}, {"name":"UG","count":100} ],
  "patterns": [
    {"pattern":"[celery] example_task fails: KeyError 'price'","service":"celery","count":310,"class":"new","jira":"JIJI-00001","datadog_url":null,"source_task":"JIJI-00000","confidence":"medium","note":null},
    {"pattern":"Exception on /api/example [GET] — ValueError","service":"uwsgi","count":220,"class":"covered","jira":"JIJI-00002","datadog_url":null,"source_task":null,"confidence":null,"note":null},
    {"pattern":"Інфраструктурний шум (решта)","service":"celery + uwsgi","count":710,"class":"noise","jira":null,"datadog_url":null,"source_task":null,"confidence":null,"note":"Elasticsearch timeout 400, Redis/Valkey timeout 250, поодинокі (≤2 події) 60"}
  ],
  "created_tickets": [ {"key":"JIJI-00001","title":"[celery] example_task fails: KeyError 'price'","source_task":"JIJI-00000","confidence":"medium"} ],
  "over_limit": [],
  "methodology": {
    "query": "status:error service:(celery OR uwsgi) -env:jiji-dev*",
    "window": "now-12h … now",
    "metrics": [ {"name":"Усього помилок","definition":"кількість error-логів за запитом у вікні"} ],
    "status_thresholds": "🟢 0 нових 🔴 · 🟡 1–2 · 🔴 ≥3",
    "source_method": "git blame ±5 рядків, git log -L, git log -S; PR через Bitbucket API",
    "confidence_levels": "high — коміт змінив рядок і є Jira-ключ; medium — та сама функція; low — непрямі ознаки"
  },
  "failed_calls": []
}
</script>

<script>
(function () {
  const D = JSON.parse(document.getElementById("report-data").textContent);
  const app = document.getElementById("app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = n => Number(n ?? 0).toLocaleString("uk-UA");
  const jira = k => k ? `<a href="https://jijing.atlassian.net/browse/${encodeURIComponent(k)}">${esc(k)}</a>` : "—";
  const ext = (u, t) => u && /^https:\/\//.test(u) ? `<a href="${esc(u)}">${esc(t)}</a>` : "—";
  const STATUS = {
    stable:   { t: "🟢 Stable",   c: "var(--green)" },
    watch:    { t: "🟡 Watch",    c: "var(--amber)" },
    degraded: { t: "🔴 Degraded", c: "var(--red)" }
  };
  const CLS = { new: ["new", "🔴 нове"], covered: ["covered", "✅ покрито"], noise: ["noise", "🚫 шум"] };

  function hourly(points) {
    if (!points || !points.length) return `<p class="empty">no data</p>`;
    const W = 640, H = 220, L = 40, R = 10, T = 12, B = 28;
    const max = Math.max(...points.map(p => p.count), 1);
    const step = Math.pow(10, Math.floor(Math.log10(max)));
    const tick = [1, 2, 5, 10].map(m => m * step).find(t => max / t <= 5) || step;
    const top = Math.ceil(max / tick) * tick;
    const y = v => T + (H - T - B) * (1 - v / top);
    const bw = (W - L - R) / points.length;
    let g = "";
    for (let v = 0; v <= top; v += tick)
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>` +
           `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
    const peak = Math.max(...points.map(p => p.count));
    points.forEach((p, i) => {
      const x = L + i * bw + bw * 0.18, w = bw * 0.64, h = y(0) - y(p.count);
      g += `<rect x="${x}" y="${y(p.count)}" width="${w}" height="${Math.max(h, 0)}" rx="2" fill="var(--accent)" opacity="${p.count === peak ? 1 : 0.55}"><title>${esc(p.hour_kyiv)}: ${fmt(p.count)}</title></rect>`;
      if (i % 2 === 0 || points.length <= 8)
        g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(p.hour_kyiv)}</text>`;
    });
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Погодинний розподіл помилок">${g}</svg></div>`;
  }

  function bars(rows) {
    if (!rows || !rows.length) return `<p class="empty">no data</p>`;
    const max = Math.max(...rows.map(r => r.count), 1);
    return `<div class="bars">${rows.map(r => `
      <div class="bar"><span>${esc(r.name)}</span>
        <div class="track"><div class="fill" style="width:${(r.count / max * 100).toFixed(1)}%"></div></div>
        <span class="num">${fmt(r.count)}</span></div>`).join("")}</div>`;
  }

  const st = STATUS[D.status?.level] || { t: "—", c: "var(--muted)" };
  const k = D.kpi || {};
  const vol = c => (D.patterns || []).filter(p => p.class === c).reduce((a, p) => a + (p.count || 0), 0);
  const volLabel = c => `<span class="l num">${fmt(vol(c))} подій</span>`;
  const m = D.methodology || {};

  app.innerHTML = `
  <header>
    <span class="eyebrow">Jiji · Datadog error triage · celery / uwsgi</span>
    <h1>${esc(document.title)}</h1>
    <div class="window">
      <span>Вікно UTC: <b class="num">${esc(D.window?.from_utc)} → ${esc(D.window?.to_utc)}</b></span>
      <span>Київ: <b class="num">${esc(D.window?.from_kyiv)} → ${esc(D.window?.to_kyiv)}</b></span>
      <span>Запуск: <b class="num">${esc(D.run_at_kyiv)}</b> (Київ)</span>
    </div>
    ${D.example ? `<span class="example">Приклад даних шаблону — не реальний звіт</span>` : ""}
  </header>

  <section class="status" style="--status-c:${st.c}" aria-label="Стан продукту">
    <span class="badge">${st.t}</span>
    <span class="rule">${esc(D.status?.rule)}</span>
    <p>${esc(D.status?.conclusion)}</p>
  </section>

  <section aria-label="Статистика вікна">
    <div class="kpis">
      <div class="kpi"><span class="v">${fmt(k.total_errors)}</span><span class="l">помилок у вікні</span></div>
      <div class="kpi"><span class="v">${fmt(k.patterns)}</span><span class="l">патернів</span></div>
      <div class="kpi"><span class="v" style="color:var(--red)">${fmt(k.new)}</span><span class="l">🔴 нових (патернів)</span>${volLabel("new")}</div>
      <div class="kpi"><span class="v" style="color:var(--green)">${fmt(k.covered)}</span><span class="l">✅ уже покрито (патернів)</span>${volLabel("covered")}</div>
      <div class="kpi"><span class="v" style="color:var(--muted)">${fmt(k.noise)}</span><span class="l">🚫 інфра-шум (патернів)</span>${volLabel("noise")}</div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Помилки по годинах <span class="muted" style="font-weight:400">(Київ)</span></h2>${hourly(D.hourly)}</div>
      <div class="panel">
        <h2>За сервісом</h2>${bars(D.by_service)}
        <h2>За країною</h2>${bars(D.by_country)}
      </div>
    </div>
  </section>

  <section>
    <h2>Патерни</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Патерн / таска / ендпоінт</th><th>Сервіс</th><th class="r">Кількість</th><th>Клас</th><th>Jira</th><th>Datadog</th><th>Джерело</th><th>Впевненість</th></tr></thead>
      <tbody>${(D.patterns || []).length ? D.patterns.map(p => {
        const c = CLS[p.class] || ["noise", esc(p.class)];
        return `<tr>
          <td class="pattern mono">${esc(p.pattern)}${p.note ? `<div class="muted" style="font-family:var(--sans)">${esc(p.note)}</div>` : ""}</td>
          <td>${esc(p.service)}</td><td class="r num">${fmt(p.count)}</td>
          <td><span class="pill ${c[0]}">${c[1]}</span></td>
          <td>${jira(p.jira)}</td><td>${ext(p.datadog_url, "логи")}</td>
          <td>${p.class === "new" ? jira(p.source_task) : "—"}</td>
          <td class="conf">${p.class === "new" ? esc(p.confidence || "—") : "—"}</td></tr>`;
      }).join("") : `<tr><td colspan="8" class="empty">no data</td></tr>`}</tbody>
    </table></div>
  </section>

  <section class="grid2">
    <div class="panel">
      <h2>Створені тікети</h2>
      ${(D.created_tickets || []).length ? `<ul class="list">${D.created_tickets.map(t => `
        <li>${jira(t.key)} — ${esc(t.title)}<br><span class="muted">джерело: ${t.source_task ? jira(t.source_task) : "не визначено"}${t.confidence ? ` · ${esc(t.confidence)}` : ""}</span></li>`).join("")}</ul>`
        : `<p class="empty">Нових тікетів у цьому запуску немає.</p>`}
    </div>
    <div class="panel">
      <h2>Кандидати понад ліміт</h2>
      ${(D.over_limit || []).length ? `<ul class="list">${D.over_limit.map(o => `<li><span class="mono">${esc(o.pattern)}</span> — <span class="num">${fmt(o.count)}</span></li>`).join("")}</ul>`
        : `<p class="empty">Немає.</p>`}
    </div>
  </section>

  <section class="method">
    <h2>Методологія</h2>
    <dl>
      <dt>Запит</dt><dd class="mono">${esc(m.query)}</dd>
      <dt>Вікно</dt><dd class="mono">${esc(m.window)}</dd>
      ${(m.metrics || []).map(x => `<dt>${esc(x.name)}</dt><dd>${esc(x.definition)}</dd>`).join("")}
      <dt>Пороги статусу</dt><dd>${esc(m.status_thresholds)}</dd>
      <dt>Визначення джерела</dt><dd>${esc(m.source_method)}</dd>
      <dt>Рівні впевненості</dt><dd>${esc(m.confidence_levels)}</dd>
      <dt>Збої викликів</dt><dd>${(D.failed_calls || []).length
        ? `<ul class="list">${D.failed_calls.map(f => `<li class="failed"><span class="mono">${esc(f.call)}</span>: ${esc(f.error)}</li>`).join("")}</ul>`
        : "немає"}</dd>
    </dl>
  </section>`;
})();
</script>
